secrets:
  VALKEY_PW:
    file: ./docker/valkey/secrets/valkey_pw_dev.txt

services:
  convproxy:
    container_name: conv-proxy
    image: traefik:v3.7.7@sha256:1cb3845d7a05e1473c9086351426597e911db49db382b6e4769f9b0744962ac8
    restart: unless-stopped
    healthcheck:
      test: traefik healthcheck --ping
      interval: 20s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:8080:80'
    networks:
      - proxy
      - default
    volumes:
      - ./docker/traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/config/dynamic-dev.yml:/etc/traefik/dynamic.yml:ro

  valkey:
    container_name: conv-valkey
    image: valkey/valkey:9.0.4-alpine@sha256:8989381add9a6333a5037692273cea43e9f1e86ceaa082d90c40b0849c1e410b
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'cat /run/secrets/VALKEY_PW | redis-cli --pass `xargs` ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 5
    command: 'valkey-server /etc/valkey/valkey.conf'
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:6379:6379'
    secrets: ['VALKEY_PW']
    environment:
      VALKEYCLI_AUTH: '/run/secrets/VALKEY_PW'
    volumes:
      - ./docker/valkey/valkey.conf:/etc/valkey/valkey.conf
    networks:
      - default

  frontend:
    container_name: conv-frontend
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    healthcheck:
      test: ['CMD-SHELL', 'curl "http://localhost:3000/ready" | grep "ready"']
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    environment:
      - FE_TARGET_HOST=conv-mediator
      - FE_TARGET_PORT=3000
    depends_on:
      - convproxy
      - mediator
    networks:
      - proxy
      - default

  converter:
    build:
      context: .
      dockerfile: services/converter/Dockerfile
    healthcheck:
      test: ['CMD-SHELL', 'curl "http://localhost:3001/ready" | grep "ready"']
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    depends_on:
      - valkey
      - mediator
    secrets: ['VALKEY_PW']
    environment:
      - CR_VALKEY_HOST=conv-valkey
      - CR_VALKEY_PORT=6379
      - CR_VALKEY_USER=default
      - CR_MEDIATOR_HOST=conv-mediator
      - CR_MEDIATOR_PORT=3000
    networks:
      - default
    deploy:
      mode: replicated
      replicas: 2

  mediator:
    container_name: conv-mediator
    build:
      context: . 
      dockerfile: services/mediator/Dockerfile
    healthcheck:
      test: ['CMD-SHELL', 'curl "http://localhost:3000/ready" | grep "ready"']
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    depends_on:
      - valkey
    secrets: ['VALKEY_PW']
    environment:
      - MR_VALKEY_HOST=conv-valkey
      - MR_VALKEY_PORT=6379
      - MR_VALKEY_USER=default
    networks:
      - default

  whoami:
    container_name: conv-whoami
    image: traefik/whoami:v1.11@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    security_opt:
      - no-new-privileges:true
    profiles:
      - debug
    networks:
      - default

  playwright:
    container_name: conv-playwright
    image: mcr.microsoft.com/playwright:v1.58.1-noble
    command: /bin/sh -c "npx -y playwright@1.58.1 run-server --port 6677 --host 0.0.0.0"
    init: true
    ipc: host
    user: pwuser
    profiles:
      - test
    ports:
      - '6677:6677'

networks:
  proxy:
  default:
